name: Daily Gujarat Samachar to Telegram

on:
  schedule:
    # 01:15 UTC = 6:45 AM IST daily (using :15 avoids GitHub's :00 top-of-hour queue delays)
    - cron: '15 1 * * *'
  workflow_dispatch: # Lets you click "Run workflow" manually to test anytime

jobs:
  fetch-and-send:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch editions and send to Telegram
        env:
          PYTHONUNBUFFERED: "1"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -u epaper_telegram.py
